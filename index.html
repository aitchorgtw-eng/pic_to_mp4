<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片轉影片工具 - 穩定版</title>
    <!-- 1. 最優先載入隔離腳本 -->
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    
    <!-- 2. 強制鎖定相同版本的 FFmpeg 資源 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-200">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
            <span class="mr-2">📸</span> 照片轉影片工具
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded bg-blue-50 text-center">
                <label class="block mb-2 font-medium text-sm">1. 上傳照片 (5-20張)</label>
                <input type="file" multiple accept="image/*" @change="handleImageUpload" class="text-xs w-full cursor-pointer">
            </div>
            <div class="border-2 border-dashed border-green-300 p-4 rounded bg-green-50 text-center">
                <label class="block mb-2 font-medium text-sm">2. 背景音樂 (MP3/MP4)</label>
                <input type="file" accept="audio/mp3,video/mp4" @change="handleMusicUpload" class="text-xs w-full cursor-pointer">
            </div>
        </div>

        <!-- 圖片清單與排序功能 (已在先前版本驗證成功) -->
        <div v-if="images && images.length > 0" class="space-y-2 mb-6 border-t pt-4">
            <div v-for="(img, index) in images" :key="img.id" class="flex items-center bg-gray-50 p-2 rounded border border-gray-200 shadow-sm">
                <span class="w-6 font-mono text-gray-400 text-xs text-center">{{index + 1}}</span>
                <img :src="img.preview" class="w-12 h-12 object-cover rounded mx-3 border shadow-sm bg-white">
                <div class="flex-grow flex items-center text-xs text-gray-600">
                    持續 <input type="number" v-model.number="img.duration" min="2" max="5" class="w-12 border rounded px-1 mx-1 text-center py-1"> 秒
                </div>
                <div class="flex space-x-1">
                    <button @click="move(index, -1)" :disabled="index === 0" class="p-2 bg-white border rounded disabled:opacity-20 hover:bg-gray-50 text-xs">↑</button>
                    <button @click="move(index, 1)" :disabled="index === images.length - 1" class="p-2 bg-white border rounded disabled:opacity-20 hover:bg-gray-50 text-xs">↓</button>
                    <button @click="remove(index)" class="p-2 bg-red-50 text-red-600 border border-red-100 rounded hover:bg-red-100 text-xs">✕</button>
                </div>
            </div>
        </div>

        <div class="border-t pt-6">
            <button 
                @click="startProcess" 
                :disabled="isProcessing || images.length < 5"
                class="w-full py-4 rounded-lg font-bold text-white transition shadow-lg text-lg"
                :class="isProcessing ? 'bg-gray-400 animate-pulse' : (images.length < 5 ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700')"
            >
                {{ isProcessing ? `🎬 正在合成影片... ${progress}%` : (images.length < 5 ? '請至少選取 5 張照片' : '🚀 開始合成影片') }}
            </button>
        </div>

        <div v-if="isProcessing" class="mt-4 w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner">
            <div class="bg-blue-600 h-full transition-all duration-300" :style="{ width: progress + '%' }"></div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const images = ref([]);
                const musicFile = ref(null);
                const isProcessing = ref(false);
                const progress = ref(0);

                const handleImageUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        images.value.push({ id: Math.random().toString(36).substring(7), file, preview: URL.createObjectURL(file), duration: 3 });
                    });
                    e.target.value = '';
                };

                const handleMusicUpload = (e) => { musicFile.value = e.target.files[0]; };
                const move = (i, d) => { const item = images.value.splice(i, 1)[0]; images.value.splice(i + d, 0, item); };
                const remove = (i) => { URL.revokeObjectURL(images.value[i].preview); images.value.splice(i, 1); };

                const startProcess = async () => {
                    if (isProcessing.value) return;
                    isProcessing.value = true;
                    progress.value = 0;

                    try {
                        // 【終極提取邏輯】
                        const FFClass = (window.FFmpegWasm && window.FFmpegWasm.FFmpeg) || window.FFmpeg;
                        const Utils = window.FFmpegUtil || (window.FFmpegWasm && window.FFmpegWasm.util);

                        if (!FFClass || !Utils) {
                            throw new Error("FFmpeg 核心組件載入異常。");
                        }

                        const ffmpeg = new FFClass();
                        const { fetchFile, toBlobURL } = Utils;

                        ffmpeg.on('progress', ({ progress: p }) => { progress.value = Math.round(p * 100); });

                        // 核心核心核心：載入 WASM
                        await ffmpeg.load({
                            coreURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js', 'text/javascript'),
                            wasmURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm', 'application/wasm'),
                        });

                        // 1. 寫入虛擬文件
                        for (let i = 0; i < images.value.length; i++) {
                            await ffmpeg.writeFile(`f${i}.jpg`, await fetchFile(images.value[i].file));
                        }
                        
                        let audioIn = [];
                        if (musicFile.value) {
                            await ffmpeg.writeFile('bgm', await fetchFile(musicFile.value));
                            audioIn = ['-i', 'bgm'];
                        }

                        // 2. 建立播放序列
                        let list = "";
                        images.value.forEach((img, i) => { list += `file 'f${i}.jpg'\nduration ${img.duration}\n`; });
                        list += `file 'f${images.value.length-1}.jpg'`;
                        await ffmpeg.writeFile('l.txt', new TextEncoder().encode(list));

                        // 3. 執行合成
                        const totalDur = images.value.reduce((a, c) => a + c.duration, 0);
                        await ffmpeg.exec([
                            '-f', 'concat', '-safe', '0', '-i', 'l.txt',
                            ...audioIn,
                            '-filter_complex', `[1:a]afade=t=out:st=${Math.max(0, totalDur-3)}:d=3[aout]`,
                            '-map', '0:v', '-map', '[aout]',
                            '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-preset', 'ultrafast', '-shortest', 'out.mp4'
                        ]);

                        // 4. 下載
                        const data = await ffmpeg.readFile('out.mp4');
                        const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `video_${Date.now()}.mp4`;
                        a.click();
                        
                    } catch (err) {
                        console.error("FFmpeg Error:", err);
                        alert("合成失敗：" + err.message + "\n建議使用電腦版 Chrome 並重新整理頁面。");
                    } finally {
                        isProcessing.value = false;
                    }
                };

                return { images, musicFile, handleImageUpload, handleMusicUpload, move, remove, startProcess, isProcessing, progress };
            }
        }).mount('#app');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片轉影片 - 穩定版</title>
    <!-- 1. 最優先載入隔離腳本 -->
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- FFmpeg UMD 資源 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body class="bg-gray-100 p-4">
    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-200">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">📸 照片轉影片工具</h1>

        <!-- 診斷區域：如果沒出現 UI，這行會顯示錯誤 -->
        <div v-if="!images" class="text-red-500 font-bold p-4">Vue 掛載失敗，請檢查主控台</div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded bg-blue-50 text-center">
                <label class="block mb-2 font-medium">1. 上傳照片 (5-20張)</label>
                <input type="file" multiple accept="image/*" @change="handleImageUpload" class="text-xs w-full">
            </div>
            <div class="border-2 border-dashed border-green-300 p-4 rounded bg-green-50 text-center">
                <label class="block mb-2 font-medium">2. 背景音樂 (MP3/MP4)</label>
                <input type="file" accept="audio/mp3,video/mp4" @change="handleMusicUpload" class="text-xs w-full">
            </div>
        </div>

        <!-- 圖片清單與排序 -->
        <div v-if="images.length > 0" class="space-y-2 mb-6 border-t pt-4">
            <div v-for="(img, index) in images" :key="img.id" class="flex items-center bg-gray-50 p-2 rounded border border-gray-200 shadow-sm">
                <span class="w-6 font-mono text-gray-400 text-xs">{{index + 1}}</span>
                <img :src="img.preview" class="w-12 h-12 object-cover rounded mx-3 border border-white">
                <div class="flex-grow flex items-center text-xs">
                    <input type="number" v-model.number="img.duration" min="2" max="5" class="w-10 border rounded px-1 py-1"> 秒
                </div>
                <div class="flex space-x-1">
                    <button @click="move(index, -1)" :disabled="index === 0" class="p-1 bg-white border rounded disabled:opacity-30">↑</button>
                    <button @click="move(index, 1)" :disabled="index === images.length - 1" class="p-1 bg-white border rounded disabled:opacity-30">↓</button>
                    <button @click="remove(index)" class="p-1 text-red-500 font-bold">✕</button>
                </div>
            </div>
        </div>

        <button @click="startProcess" :disabled="isProcessing || images.length < 5"
            class="w-full py-4 rounded-lg font-bold text-white shadow-lg transition"
            :class="isProcessing ? 'bg-gray-400' : (images.length < 5 ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700')">
            {{ isProcessing ? `🚀 合成中... ${progress}%` : (images.length < 5 ? '請至少上傳 5 張照片' : '🚀 開始合成影片') }}
        </button>

        <div v-if="isProcessing" class="mt-4 w-full bg-gray-200 rounded-full h-2">
            <div class="bg-blue-600 h-full rounded-full transition-all" :style="{ width: progress + '%' }"></div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const images = ref([]);
                const musicFile = ref(null);
                const isProcessing = ref(false);
                const progress = ref(0);

                const handleImageUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        images.value.push({ id: Math.random(), file, preview: URL.createObjectURL(file), duration: 3 });
                    });
                    e.target.value = '';
                };
                const handleMusicUpload = (e) => { musicFile.value = e.target.files[0]; };
                const move = (i, d) => {
                    const target = i + d;
                    const item = images.value.splice(i, 1)[0];
                    images.value.splice(target, 0, item);
                };
                const remove = (i) => images.value.splice(i, 1);

                const startProcess = async () => {
                    if (isProcessing.value) return;
                    isProcessing.value = true;
                    progress.value = 0;

                    try {
                        // 【地毯式搜索建構函式】
                        const FFClass = (window.FFmpegWasm && window.FFmpegWasm.FFmpeg) || 
                                        (window.ffmpeg && window.ffmpeg.FFmpeg) || 
                                        window.FFmpeg;
                        
                        const Utils = window.FFmpegUtil;

                        if (typeof FFClass !== 'function') {
                            throw new Error("無法偵測到 FFmpeg 建構函式，請確認腳本已載入。");
                        }

                        const ffmpeg = new FFClass();
                        const { fetchFile, toBlobURL } = Utils;

                        ffmpeg.on('progress', ({ progress: p }) => { progress.value = Math.round(p * 100); });

                        await ffmpeg.load({
                            coreURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js', 'text/javascript'),
                            wasmURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm', 'application/wasm'),
                        });

                        for (let i = 0; i < images.value.length; i++) {
                            await ffmpeg.writeFile(`f${i}.jpg`, await fetchFile(images.value[i].file));
                        }
                        
                        let audioIn = [];
                        if (musicFile.value) {
                            await ffmpeg.writeFile('bgm', await fetchFile(musicFile.value));
                            audioIn = ['-i', 'bgm'];
                        }

                        let list = "";
                        images.value.forEach((img, i) => {
                            list += `file 'f${i}.jpg'\nduration ${img.duration}\n`;
                        });
                        list += `file 'f${images.value.length-1}.jpg'`;
                        await ffmpeg.writeFile('l.txt', new TextEncoder().encode(list));

                        const total = images.value.reduce((a, c) => a + c.duration, 0);

                        await ffmpeg.exec([
                            '-f', 'concat', '-safe', '0', '-i', 'l.txt',
                            ...audioIn,
                            '-filter_complex', `[1:a]afade=t=out:st=${total-3}:d=3[aout]`,
                            '-map', '0:v', '-map', '[aout]',
                            '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-preset', 'ultrafast', '-shortest', 'out.mp4'
                        ]);

                        const data = await ffmpeg.readFile('out.mp4');
                        const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `video.mp4`;
                        link.click();

                    } catch (err) {
                        console.error(err);
                        alert("合成失敗: " + err.message);
                    } finally {
                        isProcessing.value = false;
                    }
                };
                return { images, musicFile, handleImageUpload, handleMusicUpload, move, remove, startProcess, isProcessing, progress };
            }
        }).mount('#app');
    </script>
</body>
</html>

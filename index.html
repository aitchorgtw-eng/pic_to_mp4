<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 照片轉影片工具 - 最終修復版</title>
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
            <span class="mr-2">📸</span> 照片轉影片工具
        </h1>

        <!-- 1. 上傳區域 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded text-center bg-blue-50">
                <label class="block mb-2 font-medium text-sm">1. 上傳照片 (5-20張)</label>
                <input type="file" multiple accept="image/*" @change="handleImageUpload" class="text-xs w-full cursor-pointer">
            </div>
            <div class="border-2 border-dashed border-green-300 p-4 rounded text-center bg-green-50">
                <label class="block mb-2 font-medium text-sm">2. 背景音樂 (MP3/MP4)</label>
                <input type="file" accept="audio/mp3,video/mp4" @change="handleMusicUpload" class="text-xs w-full cursor-pointer">
            </div>
        </div>

        <!-- 2. 圖片清單 -->
        <div v-if="images && images.length > 0" class="space-y-2 mb-6 border-t pt-4">
            <h3 class="font-bold text-xs uppercase text-gray-500 mb-2">已選照片 ({{images.length}}/20)</h3>
            <div v-for="(img, index) in images" :key="img.id" class="flex items-center bg-gray-50 p-2 rounded border border-gray-200">
                <span class="w-6 font-mono text-gray-400 text-xs text-center">{{index + 1}}</span>
                <img :src="img.preview" class="w-12 h-12 object-cover rounded mx-3 border shadow-sm bg-white">
                <div class="flex-grow flex items-center text-xs">
                    <span>持續</span>
                    <input type="number" v-model.number="img.duration" min="2" max="5" class="w-12 border rounded px-1 mx-1 text-center py-1">
                    <span>秒</span>
                </div>
                <div class="flex space-x-1">
                    <button @click="move(index, -1)" :disabled="index === 0" class="p-2 bg-white border rounded disabled:opacity-20 hover:bg-gray-50 text-xs">↑</button>
                    <button @click="move(index, 1)" :disabled="index === images.length - 1" class="p-2 bg-white border rounded disabled:opacity-20 hover:bg-gray-50 text-xs">↓</button>
                    <button @click="remove(index)" class="p-2 bg-red-50 text-red-600 border border-red-100 rounded hover:bg-red-100 text-xs">✕</button>
                </div>
            </div>
        </div>

        <!-- 3. 控制 -->
        <div class="border-t pt-6">
            <button 
                @click="startProcess" 
                :disabled="isProcessing || images.length < 5"
                class="w-full py-4 rounded-lg font-bold text-white transition shadow-lg text-lg"
                :class="isProcessing ? 'bg-gray-400 animate-pulse' : (images.length < 5 ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700')"
            >
                {{ isProcessing ? `🎬 合成中... ${progress}%` : (images.length < 5 ? '請至少選取 5 張照片' : '🚀 開始合成影片') }}
            </button>
        </div>

        <div v-if="isProcessing" class="mt-4 w-full bg-gray-200 rounded-full h-3 overflow-hidden">
            <div class="bg-blue-600 h-full transition-all duration-300 shadow-inner" :style="{ width: progress + '%' }"></div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const images = ref([]);
                const musicFile = ref(null);
                const isProcessing = ref(false);
                const progress = ref(0);

                const handleImageUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        images.value.push({
                            id: Math.random().toString(36).substring(7),
                            file: file,
                            preview: URL.createObjectURL(file),
                            duration: 3
                        });
                    });
                    e.target.value = '';
                };

                const handleMusicUpload = (e) => { musicFile.value = e.target.files[0]; };

                const move = (index, delta) => {
                    const newIdx = index + delta;
                    if (newIdx < 0 || newIdx >= images.value.length) return;
                    const item = images.value.splice(index, 1)[0];
                    images.value.splice(newIdx, 0, item);
                };

                const remove = (index) => {
                    URL.revokeObjectURL(images.value[index].preview);
                    images.value.splice(index, 1);
                };

                const startProcess = async () => {
                    if (isProcessing.value) return;
                    isProcessing.value = true;
                    progress.value = 0;

                    try {
                        // 【全方位相容性修正】尋找 FFmpeg 建構函式
                        const FFInstance = window.FFmpegWasm?.FFmpeg || window.ffmpeg?.FFmpeg;
                        const FFUtils = window.FFmpegUtil;

                        if (!FFInstance) throw new Error("找不到 FFmpeg 引擎，請重新載入頁面");

                        const ffmpeg = new FFInstance();
                        const { fetchFile, toBlobURL } = FFUtils;

                        ffmpeg.on('progress', ({ progress: p }) => {
                            progress.value = Math.round(p * 100);
                        });

                        await ffmpeg.load({
                            coreURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js', 'text/javascript'),
                            wasmURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm', 'application/wasm'),
                        });

                        // 1. 寫入圖片
                        for (let i = 0; i < images.value.length; i++) {
                            await ffmpeg.writeFile(`f${i}.jpg`, await fetchFile(images.value[i].file));
                        }

                        // 2. 處理背景音樂
                        let audioIn = [];
                        if (musicFile.value) {
                            await ffmpeg.writeFile('bgm_in', await fetchFile(musicFile.value));
                            audioIn = ['-i', 'bgm_in'];
                        }

                        // 3. 建立播放序列 (Concat Demuxer)
                        let list = "";
                        images.value.forEach((img, i) => {
                            list += `file 'f${i}.jpg'\nduration ${img.duration}\n`;
                        });
                        list += `file 'f${images.value.length-1}.jpg'`; // 重複最後一幀避免 FFmpeg 截斷
                        await ffmpeg.writeFile('list.txt', new TextEncoder().encode(list));

                        // 4. 計算消音
                        const total = images.value.reduce((acc, c) => acc + c.duration, 0);
                        const fadeOut = Math.max(0, total - 3);

                        // 5. 執行合成
                        await ffmpeg.exec([
                            '-f', 'concat', '-safe', '0', '-i', 'list.txt',
                            ...audioIn,
                            '-filter_complex', `[1:a]afade=t=out:st=${fadeOut}:d=3[aout]`,
                            '-map', '0:v', '-map', '[aout]',
                            '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-preset', 'ultrafast', '-shortest', 'out.mp4'
                        ]);

                        // 6. 匯出下載
                        const data = await ffmpeg.readFile('out.mp4');
                        const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `video_${Date.now()}.mp4`;
                        link.click();

                    } catch (err) {
                        console.error(err);
                        alert("合成失敗: " + err.message);
                    } finally {
                        isProcessing.value = false;
                    }
                };

                return { images, musicFile, handleImageUpload, handleMusicUpload, move, remove, startProcess, isProcessing, progress };
            }
        }).mount('#app');
    </script>
</body>
</html>

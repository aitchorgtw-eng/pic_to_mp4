<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 照片轉影片 - 終極突破版</title>
    <script src="coi-serviceworker.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-200">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📸 照片轉影片工具</h1>
            <div class="text-xs px-2 py-1 rounded shadow-sm" :class="envReady ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
                環境狀態: {{ envReady ? '✅ 已就緒' : '❌ 隔離未啟動' }}
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded bg-blue-50 text-center">
                <input type="file" multiple accept="image/*" @change="handleImageUpload" class="text-xs w-full cursor-pointer">
            </div>
            <div class="border-2 border-dashed border-green-300 p-4 rounded bg-green-50 text-center">
                <input type="file" accept="audio/mp3,video/mp4" @change="handleMusicUpload" class="text-xs w-full cursor-pointer">
            </div>
        </div>

        <div v-if="images.length > 0" class="space-y-2 mb-6 border-t pt-4">
             <div v-for="(img, index) in images" :key="img.id" class="flex items-center bg-gray-50 p-2 rounded border">
                <img :src="img.preview" class="w-12 h-12 object-cover rounded mx-3">
                <div class="flex-grow text-xs">
                    持續 <input type="number" v-model.number="img.duration" class="w-10 border rounded mx-1"> 秒
                </div>
                <div class="flex space-x-1">
                    <button @click="move(index, -1)" class="p-1 border rounded">↑</button>
                    <button @click="move(index, 1)" class="p-1 border rounded">↓</button>
                    <button @click="remove(index)" class="p-1 text-red-500">✕</button>
                </div>
            </div>
        </div>

        <button 
            @click="startProcess" 
            :disabled="isProcessing || images.length < 5"
            class="w-full py-4 rounded-lg font-bold text-white shadow-lg transition text-lg"
            :class="isProcessing ? 'bg-gray-400 animate-pulse' : (images.length < 5 ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700')"
        >
            {{ isProcessing ? `🚀 處理中... ${progress}%` : '開始合成影片' }}
        </button>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const images = ref([]);
                const musicFile = ref(null);
                const isProcessing = ref(false);
                const progress = ref(0);
                const envReady = ref(typeof SharedArrayBuffer !== 'undefined');

                const handleImageUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        images.value.push({ id: Math.random(), file, preview: URL.createObjectURL(file), duration: 3 });
                    });
                };
                const handleMusicUpload = (e) => { musicFile.value = e.target.files[0]; };
                const move = (i, d) => { const item = images.value.splice(i, 1)[0]; images.value.splice(i + d, 0, item); };
                const remove = (i) => images.value.splice(i, 1);

                const startProcess = async () => {
                    if (!envReady.value) {
                        alert("隔離環境未就緒，請手動重新整理頁面。");
                        return;
                    }
                    isProcessing.value = true;
                    progress.value = 0;

                    try {
                        const FF = window.FFmpegWasm?.FFmpeg || window.FFmpeg?.FFmpeg || window.ffmpeg?.FFmpeg;
                        const UT = window.FFmpegUtil || window.FFmpegWasm?.util;

                        if (!FF || !UT) throw new Error("腳本未就緒，請等待 3 秒後再試，或使用 Ctrl+F5 重新整理。");
                        
                        const ffmpeg = new FF();
                        ffmpeg.on('progress', ({ progress: p }) => { progress.value = Math.round(p * 100); });

                        // 載入核心 WASM
                        await ffmpeg.load({
                            coreURL: await UT.toBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js', 'text/javascript'),
                            wasmURL: await UT.toBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm', 'application/wasm'),
                        });

                        // 寫入圖片
                        for (let i = 0; i < images.value.length; i++) {
                            await ffmpeg.writeFile(`f${i}.jpg`, await UT.fetchFile(images.value[i].file));
                        }
                        
                        let audioIn = [];
                        if (musicFile.value) {
                            await ffmpeg.writeFile('bgm', await UT.fetchFile(musicFile.value));
                            audioIn = ['-i', 'bgm'];
                        }

                        // 生成清單
                        let list = images.value.map((img, i) => `file 'f${i}.jpg'\nduration ${img.duration}`).join('\n');
                        list += `\nfile 'f${images.value.length-1}.jpg'`;
                        await ffmpeg.writeFile('l.txt', new TextEncoder().encode(list));

                        const total = images.value.reduce((a, c) => a + c.duration, 0);

                        // 執行合成
                        await ffmpeg.exec([
                            '-f', 'concat', '-safe', '0', '-i', 'l.txt',
                            ...audioIn,
                            '-filter_complex', `[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p[v];[1:a]afade=t=out:st=${Math.max(0, total-3)}:d=3[aout]`,
                            '-map', '[v]', '-map', '[aout]',
                            '-c:v', 'libx264', '-preset', 'ultrafast', '-shortest', 'out.mp4'
                        ]);

                        const data = await ffmpeg.readFile('out.mp4');
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                        link.download = `output_${Date.now()}.mp4`;
                        link.click();

                    } catch (err) {
                        alert("系統錯誤：" + err.message);
                    } finally {
                        isProcessing.value = false;
                    }
                };
                return { images, handleImageUpload, handleMusicUpload, move, remove, startProcess, isProcessing, progress, envReady };
            }
        }).mount('#app');
    </script>
</body>
</html>

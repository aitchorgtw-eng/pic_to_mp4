<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環境修復 - 資訊設計師</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #status { font-weight: bold; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>FFmpeg 環境檢查 (修復版)</h1>
    <p>狀態：<span id="status">檢查中...</span></p>

    <script>
        async function checkEnvironment() {
            const status = document.getElementById('status');
            
            // 等待 Service Worker 準備就緒
            if ('serviceWorker' in navigator) {
                const registration = await navigator.serviceWorker.ready;
                console.log("Service Worker 已就緒:", registration);
            }

            if (typeof SharedArrayBuffer !== 'undefined') {
                status.innerHTML = "✅ 跨來源隔離已開啟！環境已就緒。";
                status.style.color = "green";
                status.style.backgroundColor = "#eaffea";
            } else {
                if (window.crossOriginIsolated === false) {
                    // 檢查是否已經嘗試過重整 (透過 URL 參數)
                    const urlParams = new URLSearchParams(window.location.search);
                    if (!urlParams.has('reloaded')) {
                        status.innerHTML = "⏳ 正在激活隔離環境，請稍候...";
                        setTimeout(() => {
                            window.location.search = "reloaded=true";
                        }, 2000);
                    } else {
                        status.innerHTML = "❌ 自動激活失敗。請「徹底關閉瀏覽器」後重新開啟此頁面，或檢查是否使用無痕模式 (無痕模式有時會停用 SW)。";
                        status.style.color = "red";
                    }
                }
            }
        }
        window.onload = checkEnvironment;
    </script>
</body>
</html>

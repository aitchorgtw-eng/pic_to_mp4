<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 照片轉影片 - ESM 終極穩定版</title>
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-200">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📸 照片轉影片工具</h1>
            <div class="text-xs px-2 py-1 rounded shadow-sm" :class="envReady ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
                環境狀態: {{ envReady ? '✅ 已就緒' : '❌ 隔離未啟動' }}
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded bg-blue-50 text-center">
                <input type="file" multiple accept="image/*" @change="handleImageUpload" class="text-xs w-full cursor-pointer">
            </div>
            <div class="border-2 border-dashed border-green-300 p-4 rounded bg-green-50 text-center">
                <input type="file" accept="audio/mp3,video/mp4" @change="handleMusicUpload" class="text-xs w-full cursor-pointer">
            </div>
        </div>

        <div v-if="images.length > 0" class="space-y-2 mb-6 border-t pt-4">
             <div v-for="(img, index) in images" :key="img.id" class="flex items-center bg-gray-50 p-2 rounded border">
                <span class="w-6 font-mono text-gray-400 text-xs text-center">{{index + 1}}</span>
                <img :src="img.preview" class="w-12 h-12 object-cover rounded mx-3">
                <div class="flex-grow text-xs">
                    持續 <input type="number" v-model.number="img.duration" min="2" max="5" class="w-10 border rounded mx-1 text-center"> 秒
                </div>
                <div class="flex space-x-1">
                    <button @click="move(index, -1)" :disabled="index === 0" class="p-1 border rounded bg-white disabled:opacity-30">↑</button>
                    <button @click="move(index, 1)" :disabled="index === images.length - 1" class="p-1 border rounded bg-white disabled:opacity-30">↓</button>
                    <button @click="remove(index)" class="p-1 text-red-500 font-bold">✕</button>
                </div>
            </div>
        </div>

        <div v-if="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded border border-red-200 text-sm">
            {{ errorMessage }}
        </div>

        <button 
            @click="startProcess" 
            :disabled="isProcessing || images.length < 5"
            class="w-full py-4 rounded-lg font-bold text-white shadow-lg transition text-lg"
            :class="isProcessing ? 'bg-gray-400' : (images.length < 5 ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700')"
        >
            {{ buttonText }}
        </button>

        <div v-if="isProcessing && progress > 0" class="mt-4 w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner">
            <div class="bg-blue-600 h-full transition-all duration-300" :style="{ width: progress + '%' }"></div>
        </div>
    </div>

    <script type="module">
        import { createApp, ref, computed } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js';
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/esm/index.js';
        import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        createApp({
            setup() {
                const images = ref([]);
                const musicFile = ref(null);
                const isProcessing = ref(false);
                const progress = ref(0);
                const loadingStage = ref(''); 
                const errorMessage = ref('');
                const envReady = ref(typeof SharedArrayBuffer !== 'undefined');

                const handleImageUpload = (e) => {
                    errorMessage.value = '';
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        images.value.push({ id: Math.random(), file, preview: URL.createObjectURL(file), duration: 3 });
                    });
                    e.target.value = '';
                };
                
                const handleMusicUpload = (e) => { musicFile.value = e.target.files[0]; };
                const move = (i, d) => { const item = images.value.splice(i, 1)[0]; images.value.splice(i + d, 0, item); };
                const remove = (i) => { URL.revokeObjectURL(images.value[i].preview); images.value.splice(i, 1); };

                const buttonText = computed(() => {
                    if (images.value.length < 5) return '請至少選取 5 張照片';
                    if (!isProcessing.value) return '🚀 開始合成影片';
                    if (loadingStage.value === 'downloading') return '⏳ 正在下載核心引擎 (首次約需 1-3 分鐘)...';
                    if (loadingStage.value === 'encoding') return `🎬 影片合成中... ${progress.value}%`;
                    return '處理中...';
                });

                const startProcess = async () => {
                    if (!envReady.value) {
                        errorMessage.value = "隔離環境未就緒，無法進行合成。請確保使用電腦版瀏覽器並重整頁面。";
                        return;
                    }
                    
                    isProcessing.value = true;
                    errorMessage.value = '';
                    progress.value = 0;

                    try {
                        const ffmpeg = new FFmpeg();
                        ffmpeg.on('progress', ({ progress: p }) => { 
                            progress.value = Math.round(p * 100); 
                        });

                        // 2. 下載引擎 (加入 classWorkerURL 解決跨來源 Worker 阻擋問題)
                        loadingStage.value = 'downloading';
                        const coreURL = await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js', 'text/javascript');
                        const wasmURL = await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm', 'application/wasm');
                        // 【關鍵修復】：將 Worker 也轉換為本地 Blob
                        const classWorkerURL = await toBlobURL('https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/esm/worker.js', 'text/javascript');
                        
                        await ffmpeg.load({ 
                            coreURL, 
                            wasmURL,
                            classWorkerURL 
                        });

                        // 3. 進入編碼階段
                        loadingStage.value = 'encoding';
                        
                        for (let i = 0; i < images.value.length; i++) {
                            await ffmpeg.writeFile(`f${i}.jpg`, await fetchFile(images.value[i].file));
                        }
                        
                        let audioIn = [];
                        if (musicFile.value) {
                            await ffmpeg.writeFile('bgm', await fetchFile(musicFile.value));
                            audioIn = ['-i', 'bgm'];
                        }

                        let list = images.value.map((img, i) => `file 'f${i}.jpg'\nduration ${img.duration}`).join('\n');
                        list += `\nfile 'f${images.value.length-1}.jpg'`;
                        await ffmpeg.writeFile('l.txt', new TextEncoder().encode(list));

                        const total = images.value.reduce((a, c) => a + c.duration, 0);

                        await ffmpeg.exec([
                            '-f', 'concat', '-safe', '0', '-i', 'l.txt',
                            ...audioIn,
                            '-filter_complex', `[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p[v];[1:a]afade=t=out:st=${Math.max(0, total-3)}:d=3[aout]`,
                            '-map', '[v]', '-map', '[aout]',
                            '-c:v', 'libx264', '-preset', 'ultrafast', '-shortest', 'out.mp4'
                        ]);

                        // 4. 完成與下載
                        const data = await ffmpeg.readFile('out.mp4');
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                        link.download = `video_${Date.now()}.mp4`;
                        link.click();

                    } catch (err) {
                        errorMessage.value = "合成過程發生錯誤：" + err.message;
                        console.error(err);
                    } finally {
                        isProcessing.value = false;
                        loadingStage.value = '';
                    }
                };
                return { images, handleImageUpload, handleMusicUpload, move, remove, startProcess, isProcessing, progress, envReady, buttonText, errorMessage };
            }
        }).mount('#app');
    </script>
</body>
</html>
